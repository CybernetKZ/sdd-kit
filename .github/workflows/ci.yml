# CI for sdd-kit itself: lint every script/template, then a real install.sh
# smoke test on an empty repository.
name: ci
on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck all shell scripts
        run: shellcheck -S warning install.sh uninstall.sh templates/*.sh templates/scripts/sdd/*.sh
      - name: bash syntax
        run: |
          bash -n install.sh uninstall.sh
          for f in templates/pre-commit-hook.sh templates/sdd-doctor.sh templates/scripts/sdd/*.sh; do
            bash -n "$f"
          done
      - name: node syntax (hooks)
        run: for f in templates/*.cjs; do node --check "$f"; done
      - name: python syntax (spec-lint)
        run: python3 -m py_compile templates/spec-lint.py
      - name: workflow YAML parses
        run: |
          python3 - <<'EOF'
          import yaml, glob
          for f in glob.glob('.github/workflows/*.yml'):
              yaml.safe_load(open(f))
              print('ok', f)
          EOF
      - name: JSON templates parse
        run: |
          for f in templates/*.json; do python3 -m json.tool "$f" > /dev/null && echo "ok $f"; done
      - name: profiles are valid shell fragments
        run: for f in profiles/*.env; do bash -n "$f"; done

  bootstrap-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install into an empty repo (no TTY, auto-yes; no uv -> youtrack skipped)
        run: |
          git init -q /tmp/smoke-repo
          SDD_KIT_ASSUME_YES=1 ./install.sh --repo-only /tmp/smoke-repo
      - name: gates work in the installed repo
        run: |
          cd /tmp/smoke-repo
          bash scripts/sdd/check.sh
          bash scripts/sdd/doctor.sh || true   # advisory: warns on a bare runner, never blocks
          test -x .git/hooks/pre-commit
          grep -q "scripts/sdd/check.sh" .git/hooks/pre-commit
      - name: PROFILE_OPENSPEC_SEED_REF restores openspec/ from a git ref instead of init
        run: |
          R=/tmp/seed-repo/conversation_flow   # basename picks profiles/conversation_flow.env
          git init -q -b main $R && cd $R
          git config user.email t@t && git config user.name t
          echo x > README.md && git add -A && git commit -qm init
          git checkout -q -b test-sdd-kit      # the ref that profile points at
          mkdir -p openspec/specs/asr && echo '# asr' > openspec/specs/asr/spec.md
          git add -A && git commit -qm specs && git checkout -q main
          SDD_KIT_ASSUME_YES=1 $GITHUB_WORKSPACE/install.sh --repo-only $R
          grep -qx '# asr' openspec/specs/asr/spec.md   # seeded content, not a fresh skeleton
      - name: install is idempotent (second run changes nothing)
        run: |
          cd /tmp/smoke-repo
          find . -path ./.git -prune -o -type f -print | sort | xargs md5sum > /tmp/before.md5
          SDD_KIT_ASSUME_YES=1 $GITHUB_WORKSPACE/install.sh --repo-only /tmp/smoke-repo
          find . -path ./.git -prune -o -type f -print | sort | xargs md5sum > /tmp/after.md5
          diff /tmp/before.md5 /tmp/after.md5
      - name: refresh restores kit-owned files, leaves repo-owned ones alone
        run: |
          cd /tmp/smoke-repo
          echo "GARBAGE from CI" >> .claude/scripts/review-prompt.md
          md5sum AGENTS.md .claude/settings.json > /tmp/repo-owned.md5
          SDD_KIT_ASSUME_YES=1 $GITHUB_WORKSPACE/install.sh --refresh /tmp/smoke-repo
          cmp .claude/scripts/review-prompt.md $GITHUB_WORKSPACE/templates/review-prompt.md
          md5sum -c /tmp/repo-owned.md5   # AGENTS.md / settings.json untouched
      - name: refresh is idempotent (second run refreshes nothing)
        run: |
          cd /tmp/smoke-repo
          SDD_KIT_ASSUME_YES=1 $GITHUB_WORKSPACE/install.sh --refresh /tmp/smoke-repo | tee /tmp/refresh2.log
          grep -q "refresh done: 0 files refreshed" /tmp/refresh2.log
          ! grep -q "\[sdd-kit\] refreshed:" /tmp/refresh2.log
      - name: uninstall round-trips to an empty repo
        run: |
          cd /tmp/smoke-repo
          SDD_KIT_ASSUME_YES=1 $GITHUB_WORKSPACE/uninstall.sh /tmp/smoke-repo
          LEFT=$(find . -path ./.git -prune -o -type f -print)
          [ -z "$LEFT" ] || { echo "FAIL: files left after uninstall:"; echo "$LEFT"; exit 1; }
