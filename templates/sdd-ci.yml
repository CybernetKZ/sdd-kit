# Required SDD gate on pull requests.
# Install as .github/workflows/sdd-ci.yml and mark as a required check in branch settings.
name: sdd-gate

on:
  pull_request:

jobs:
  sdd-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: SDD checks (AGENTS.md + openspec validate)
        run: make sdd-check

  # Advisory single-entry test signal (ADR-0015): ruff + pytest, if the repo
  # has either. A red run here is visible in the PR but is NOT a required
  # check - no continue-on-error, this is a real pass/fail, just not blocking.
  tests:
    name: tests (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: make test (advisory)
        run: make test

  # TBD disciplines (ADR-0006): branch age + PR size.
  # Escape hatch: labels `long-lived-ok` / `xl-ok` - anyone may set them, but the
  # PR body must contain a "Why long-lived:" / "Why XL:" line with a real reason.
  tbd-gates:
    runs-on: ubuntu-latest
    env:
      BRANCH_WARN_DAYS: 2
      BRANCH_FAIL_DAYS: 5
      PR_XL_LINES: 1500   # edit here if this repo genuinely needs a different limit
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Branch age and PR size
        env:
          BASE: ${{ github.base_ref }}
        run: |
          EV="$GITHUB_EVENT_PATH"
          has_label()   { jq -e --arg l "$1" '.pull_request.labels[].name | select(. == $l)' "$EV" >/dev/null; }
          has_reason()  { jq -r '.pull_request.body // ""' "$EV" | grep -qiE "^[#* ]*$1:.{10,}"; }
          FAILED=0

          git fetch origin "$BASE" --quiet
          MB=$(git merge-base "origin/$BASE" HEAD)
          AGE=$(( ( $(date +%s) - $(git show -s --format=%ct "$MB") ) / 86400 ))
          if [ "$AGE" -gt "$BRANCH_FAIL_DAYS" ]; then
            if has_label long-lived-ok && has_reason "Why long-lived"; then
              echo "branch age: $AGE days - allowed by long-lived-ok label with reason"
            elif has_label long-lived-ok; then
              echo "FAIL: long-lived-ok label set, but PR body has no 'Why long-lived: <reason>' line"
              echo "next: add 'Why long-lived: <reason>' to the PR description"
              FAILED=1
            else
              echo "FAIL: branch diverged from $BASE $AGE days ago (limit: $BRANCH_FAIL_DAYS)"
              echo "next: rebase on $BASE and split the change, or label long-lived-ok + 'Why long-lived:' in the body"
              FAILED=1
            fi
          elif [ "$AGE" -gt "$BRANCH_WARN_DAYS" ]; then
            echo "WARN: branch diverged from $BASE $AGE days ago - merge daily (ADR-0006)"
          else
            echo "branch age: $AGE days - OK"
          fi

          LINES=$(jq '.pull_request.additions + .pull_request.deletions' "$EV")
          if [ "$LINES" -gt "$PR_XL_LINES" ]; then
            if has_label xl-ok && has_reason "Why XL"; then
              echo "PR size: $LINES lines - allowed by xl-ok label with reason"
            elif has_label xl-ok; then
              echo "FAIL: xl-ok label set, but PR body has no 'Why XL: <reason>' line"
              echo "next: add 'Why XL: <reason>' to the PR description"
              FAILED=1
            else
              echo "FAIL: PR changes $LINES lines (limit: $PR_XL_LINES)"
              echo "next: split into smaller PRs (one OpenSpec change each), or label xl-ok + 'Why XL:' in the body"
              FAILED=1
            fi
          else
            echo "PR size: $LINES lines - OK"
          fi

          exit "$FAILED"
