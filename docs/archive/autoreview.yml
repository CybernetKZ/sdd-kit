# Auto-review on pull requests (rationale/design notes: docs/archive/autoreviewer.md).
# Logic layer: repo reviewer agents (.claude/agents/) via headless `claude -p`,
# fed a static-tool report it must verify before reporting.
# Deterministic lint lives in pre-commit (ruff --fix) - not duplicated here.
#
# Auth: Claude Code SUBSCRIPTION (OAuth), NOT an Anthropic API key.
# One-time setup: run `claude setup-token` on a logged-in machine and save the
# printed token as the repo/org secret CLAUDE_CODE_OAUTH_TOKEN.
# The whole job is skipped without the secret; never pass --bare (API-key-only mode).
name: autoreview

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  claude-review:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      # First step on purpose: without the secret nothing below is worth the CI minutes.
      - name: Skip when CLAUDE_CODE_OAUTH_TOKEN is not configured
        id: key
        run: |
          if [ -z "${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN secret missing - AI review skipped (create one with: claude setup-token)"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.present == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: steps.key.outputs.present == 'true'
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v5
        if: steps.key.outputs.present == 'true'
      - name: Static-tool report on changed Python files (radon, complexipy, vulture, semgrep)
        if: steps.key.outputs.present == 'true'
        run: |
          FILES=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD | grep '\.py$' || true)
          {
            echo "# Static-tool leads for changed .py files (verify each in code before trusting)"
            if [ -n "$FILES" ]; then
              echo "## radon (cyclomatic complexity, B and worse)"; uvx radon cc $FILES -s -a --min B || true
              echo "## complexipy (cognitive complexity)"; uvx complexipy $FILES || true
              echo "## vulture (dead code; <100% confidence is often false)"; uvx vulture $FILES || true
              echo "## semgrep (security patterns: secrets, injection, auth)"
              uvx semgrep scan --config p/security-audit --config p/secrets \
                --severity WARNING --quiet --text $FILES || true
            else
              echo "no changed .py files"
            fi
          } > /tmp/tools.txt 2>&1
      - name: AI review with repo reviewer agents
        if: steps.key.outputs.present == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          npm install -g @anthropic-ai/claude-code
          git diff "origin/${{ github.base_ref }}"...HEAD > /tmp/sdd-review.diff
          # One canonical prompt, shared with `make sdd-review` (installed by
          # sdd-kit/install.sh). Fallback inline if the repo predates it.
          if [ -f .claude/scripts/review-prompt.md ]; then
            PROMPT="$(cat .claude/scripts/review-prompt.md)"
          else
            PROMPT="Read /tmp/sdd-review.diff and /tmp/tools.txt. Review following .claude/agents/backend-reviewer.md and .claude/agents/database-reviewer.md (read them first). Repo context: AGENTS.md. Report ONLY CRITICAL and HIGH issues, each with file:line and a one-line fix; write each finding's explanation in Russian, keep severity/action tags and the exact LGTM string in English. If there are none, reply exactly: LGTM - no CRITICAL/HIGH issues."
          fi
          claude -p "$PROMPT" --allowedTools "Read,Grep,Glob" > /tmp/review.md || true
          {
            echo "## AI review (sdd-kit autoreview)"
            echo ""
            cat /tmp/review.md
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md
